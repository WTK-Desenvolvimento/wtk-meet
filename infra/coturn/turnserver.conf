# coturn — STUN/TURN self-hosted, sem dependência de infraestrutura de terceiros.
# Referência de configuração para dev/staging. Ajuste realm/certs para produção.

listening-port=3478
tls-listening-port=5349

# Descoberta de IP público do host. Em produção, aponte para o IP/hostname real.
external-ip=127.0.0.1

# Credenciais efêmeras via TURN REST API: o mesmo shared secret configurado
# aqui deve estar em TURN_SHARED_SECRET no server/.env. Nunca usuário/senha
# estático — cada credencial expira em minutos/horas (ver turnCredentials.js).
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SHARED_SECRET

realm=wtk-meet.local

# TLS para disfarçar tráfego de mídia como HTTPS genérico em redes hostis.
# Descomente e aponte para certificados reais em produção.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Só relay de mídia — nunca decodifica SRTP nem a camada extra de E2EE.
no-tcp-relay
fingerprint

# Sem log de payload/conteúdo — só eventos operacionais mínimos.
no-stdout-log
log-file=/var/log/turnserver.log
simple-log

# Sem loopback/redes privadas como alvo de relay (evita abuso do relay para
# acessar a rede interna do host do coturn).
no-loopback-peers
no-multicast-peers

min-port=49160
max-port=49200
