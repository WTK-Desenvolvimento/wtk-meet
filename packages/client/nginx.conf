server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Cache dos assets com hash no nome. Restrito ao diretório `/assets/` de
    # propósito: com a sala na raiz (`/uma-sala-so-minha`), casar extensão em
    # qualquer path faria `/algo.js` cair aqui — e este bloco **não** tem
    # `try_files`, então o SPA nunca abriria e a resposta seria 404. O client já
    # proíbe ponto no endereço da sala, mas quem digita a URL na mão não passa
    # pela validação do client; a defesa que vale é esta.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — react-router-dom. Cobre a raiz, `/app/*` e qualquer path de
    # um segmento (`/daily`, `/uma-sala-so-minha`), que é o formato do endereço
    # de sala desde a WTK-MEET-10.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
