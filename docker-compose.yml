# Os contextos de build são a **raiz**, e não `./server` / `./client`: os dois
# `tsconfig.json` estendem `tsconfig.base.json`, que mora aqui. Um contexto por
# pacote não enxergaria o arquivo base, e o sintoma seria confuso — o `tsc` do
# server falha com "File not found", e o `vite build` do client pode
# silenciosamente ignorar o tsconfig e mudar o alvo de transpilação.
#
# O `.dockerignore` da raiz é o que impede esse contexto maior de arrastar os
# `node_modules` dos três pacotes e o `.git` para dentro do daemon.
services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      PORT: ${PORT:-4000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      CF_TURN_TOKEN_ID: ${CF_TURN_TOKEN_ID}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN}
      CF_TURN_TTL: ${CF_TURN_TTL:-86400}
      # Telemetria: vazio ⇒ desligada por inteiro (no-op, um aviso no boot).
      # Endereço **base** do collector, sem /v1/metrics. Ver
      # infra/otel/collector.example.yaml.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wtk-meet-server}
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-60000}
      TELEMETRY_RATE_LIMIT_PER_MINUTE: ${TELEMETRY_RATE_LIMIT_PER_MINUTE:-120}

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://localhost:4000}
        # **Build arg**, e não `environment`: `import.meta.env` é substituído
        # pelo Vite em build time. A mesma variável no runtime do nginx não
        # teria efeito nenhum — falha silenciosa clássica, em que
        # `VITE_TELEMETRY_ENABLED=false` parece configurado e não desliga nada.
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
    ports:
      - "80:80"
    depends_on:
      - server
