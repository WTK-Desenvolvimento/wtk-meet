services:
  server:
    build: ./server
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      PORT: ${PORT:-4000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      CF_TURN_TOKEN_ID: ${CF_TURN_TOKEN_ID}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN}
      CF_TURN_TTL: ${CF_TURN_TTL:-86400}

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://localhost:4000}
    depends_on:
      - server
