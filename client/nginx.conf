server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router-dom
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets com hash no nome
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
