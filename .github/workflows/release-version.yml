name: Update version on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update package.json versions
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --workspaces --include-workspace-root

      - name: Update extension manifest version
        run: |
          f=packages/extension/manifest.json
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json packages/extension/manifest.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push
